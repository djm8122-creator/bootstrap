<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Signup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">

        <h1>User Signup</h1>

        <form id="signupForm">

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">Username:</label>

                <input type="text"
                       id="username"
                       class="form-control"
                       placeholder="Enter username"
                       onfocus="clearError(this)"
                       onblur="validate(this)">
            </div>


            <!-- First Name -->
            <div class="mb-3">
                <label for="firstname" class="form-label">First Name:</label>

                <input type="text"
                       id="firstname"
                       class="form-control"
                       placeholder="Enter first name"
                       onfocus="clearError(this)"
                       onblur="validate(this)">
            </div>


            <!-- Last Name -->
            <div class="mb-3">
                <label for="lastname" class="form-label">Last Name:</label>

                <input type="text"
                       id="lastname"
                       class="form-control"
                       placeholder="Enter last name"
                       onfocus="clearError(this)"
                       onblur="validate(this)">
            </div>


            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>

                <input type="text"
                       id="email"
                       class="form-control"
                       placeholder="joe@test.com"
                       onfocus="clearError(this)"
                       onblur="validateEmail(this)">
            </div>


            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>

                <input type="password"
                       id="password"
                       class="form-control"
                       placeholder="Enter password"
                       onfocus="clearError(this)"
                       onblur="validate(this)">
            </div>


            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm Password:
                </label>

                <input type="password"
                       id="confirmPassword"
                       class="form-control"
                       placeholder="Confirm password"
                       onfocus="clearError(this)"
                       onblur="validateConfirmPassword(this)">
            </div>


            <!-- Sign Up Button -->
            <button type="submit" class="btn btn-primary">
                Sign Up
            </button>

        </form>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- JavaScript Validation -->
    <script>

        // Required field validation
        function validate(obj) {

            if (obj.value.trim() === "") {

                obj.value = "Field is required";
                obj.style.color = "#FF0000";

            } else {

                obj.style.color = "";

            }
        }


        // Clear error when user clicks the field
        function clearError(obj) {

            if (obj.value === "Field is required" ||
                obj.value === "Invalid email format" ||
                obj.value === "Passwords do not match") {

                obj.value = "";
                obj.style.color = "";
            }
        }


        // Email validation
        function validateEmail(obj) {

            if (obj.value.trim() === "") {

                obj.value = "Field is required";
                obj.style.color = "#FF0000";

            } else {

                // Email format
                let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(obj.value)) {

                    obj.value = "Invalid email format";
                    obj.style.color = "#FF0000";

                } else {

                    obj.style.color = "";
                }
            }
        }


        // Confirm password validation
        function validateConfirmPassword(obj) {

            let password = document.getElementById("password").value;

            if (obj.value.trim() === "") {

                obj.value = "Field is required";
                obj.style.color = "#FF0000";

            } else if (obj.value !== password) {

                obj.value = "Passwords do not match";
                obj.style.color = "#FF0000";

            } else {

                obj.style.color = "";
            }
        }


        // Validate everything when Sign Up is clicked
        document.getElementById("signupForm").addEventListener("submit", function(event) {

            let username = document.getElementById("username");
            let firstname = document.getElementById("firstname");
            let lastname = document.getElementById("lastname");
            let email = document.getElementById("email");
            let password = document.getElementById("password");
            let confirmPassword = document.getElementById("confirmPassword");

            let valid = true;


            // Username
            if (username.value.trim() === "") {
                username.value = "Field is required";
                username.style.color = "#FF0000";
                valid = false;
            }


            // First Name
            if (firstname.value.trim() === "") {
                firstname.value = "Field is required";
                firstname.style.color = "#FF0000";
                valid = false;
            }


            // Last Name
            if (lastname.value.trim() === "") {
                lastname.value = "Field is required";
                lastname.style.color = "#FF0000";
                valid = false;
            }


            // Email
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email.value.trim() === "") {

                email.value = "Field is required";
                email.style.color = "#FF0000";
                valid = false;

            } else if (!emailPattern.test(email.value)) {

                email.value = "Invalid email format";
                email.style.color = "#FF0000";
                valid = false;
            }


            // Password
            if (password.value.trim() === "") {
                password.value = "Field is required";
                password.style.color = "#FF0000";
                valid = false;
            }


            // Confirm Password
            if (confirmPassword.value.trim() === "") {

                confirmPassword.value = "Field is required";
                confirmPassword.style.color = "#FF0000";
                valid = false;

            } else if (confirmPassword.value !== password.value) {

                confirmPassword.value = "Passwords do not match";
                confirmPassword.style.color = "#FF0000";
                valid = false;
            }


            // Stop form from submitting if there are errors
            if (!valid) {
                event.preventDefault();
            } else {
                alert("Signup information is valid!");
            }

        });

    </script>

</body>

</html>
